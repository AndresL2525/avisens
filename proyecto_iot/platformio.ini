[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ───────────────────────────────────────────────────────────
; Librerías necesarias para el proyecto
; ───────────────────────────────────────────────────────────
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx
    bogde/HX711@^0.7.5
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^6.21.3
    madhephaestus/ESP32Servo@^3.0.6